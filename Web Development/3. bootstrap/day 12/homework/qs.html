<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>

</head>
<body>
    <div class="container text-center">
        <h1>Pricing</h1>
        <p>Please checkout out most effective payment models</p>

        <div class="row gy-3">
            <div class="col-6 col-md-4 d-flex justify-content-center">
                <div class="card w-100 mb-3">
                    <div class="card-header fw-bold fs-3">Free</div>
                    <div class="card-body">
                        <h5 class="card-title fw-bold fs-3">$0 / mo</h5>
                        <p class="card-text">
                            10 users included <br>
                            2GB of storage <br>
                            Email support
                        </p>
                        <button type="button" class="btn btn-outline-info">Sign up for free</button>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-4 d-flex justify-content-center">
                <div class="card w-100 mb-3">
                    <div class="card-header fw-bold fs-3">Pro</div>
                    <div class="card-body">
                        <h5 class="card-title fw-bold fs-3">$15 / mo</h5>
                        <p class="card-text">
                            20 users included <br>
                            10GB of storage <br>
                            Priority email support
                        </p>
                        <button type="button" class="btn btn-primary">Get started</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4 d-flex justify-content-center">
                <div class="card w-100 mb-3">
                    <div class="card-header fw-bold fs-3">Enterpirce</div>
                    <div class="card-body">
                        <h5 class="card-title fw-bold fs-3">$29 / mo</h5>
                        <p class="card-text">
                            30 users included <br>
                            15GB of storage <br>
                            Phone & email support
                        </p>
                        <button type="button" class="btn btn-primary">contact us</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
