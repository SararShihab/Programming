<!DOCTYPE html>
<html>
    <head>
        <title>
            Form
        </title>
    </head>
    <body>
        <form action="/action">
            <fieldset>
                <legend></legend>
                <div>
                    <label for="name">Name:</label>
                    <input type="text" name="name" id="name"/>
                </div>
                <div>
                    Sex:
                    <input type="radio" name="sex" id="m" value="M"/>
                    <label for="m">Male</label>
                    <input type="radio" name="sex" id="f" value="F"/>
                    <label for="f">Female</label>
                </div>
                <div>
                    <label for="country">Country</label>
                    <select name="country" id="country">
                        <option>Select an option</option>
                        <option value="bd">Bangladesh</option>
                        <option value="trk">Turkey</option>
                        <option value="pales">Palestine</option>
                    </select>
                </div>
                <div>
                    <label for="tarea">Message</label>
                    <br/>
                    <textarea cols="30" rows="5" name="message" id="tarea"></textarea>
                </div>
                <div>
                    <input type="checkbox" name="subscribe" id="sub"/>
                    <label for="sub">Subscribe?</label>
                </div>
                <button type="submit">Submit</button>
            </fieldset>
        </form>
    </body>
</html>
