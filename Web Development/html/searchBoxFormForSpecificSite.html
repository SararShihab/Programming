<!DOCTYPE html>
<html>
    <head>
        <title>
            Search in Google
        </title>
    </head>
    <body>
        <form action="https://www.google.com/search">
            <div>
                <label for="search">What do you want to know??</label>
                <input type="text" id="search" name="q" placeholder="Search in Google">
                <button>Search</button>
            </div>
        </form>
    </body>
</html>
